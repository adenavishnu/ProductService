spring.application.name=productservice
server.port=${PORT:8082}

# ===============================
# DB
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# TIMEZONE
# ===============================
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# ===============================
# EUREKA CLIENT
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# ===============================
# EUREKA INSTANCE (FIXED)
# ===============================
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${RAILWAY_PRIVATE_DOMAIN:localhost}
eureka.instance.non-secure-port=${PORT:8082}

#Redis Config
# spring.cache.type=redis

# spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
# spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=redis
spring.data.redis.url=${REDIS_URL}
# Cache settings

spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=product-service:

logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
